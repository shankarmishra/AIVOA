services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: aivoa
      POSTGRES_PASSWORD: aivoa
      POSTGRES_DB: aivoa
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "aivoa"]
      interval: 5s
      timeout: 5s
      retries: 5
volumes:
  pgdata:
